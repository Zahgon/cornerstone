[workspace]
resolver = "2"
members = [
    "backend",
    "frontend_slint",
    "common",
]

[workspace.package]
version = "0.1.0"
authors = ["Giovanni Ramistella <things-vacuous-07@icloud.com>"]
edition = "2024"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/gramistella/cornerstone"


[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
axum-extra = "0.10.3"
base64 = "0.22.1"
bcrypt = "0.17.1"
chrono = "0.4.42"
common = { path = "common" }
dotenvy = "0.15.7"
dprint-plugin-typescript = "0.95.11"
figment = "0.10.19"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = "1.7.0"
jsonwebtoken =  { version = "10.1.0", features = ["rust_crypto"] }
once_cell = "1.21.3"
rand = "0.9.2"
reqwest = "0.12.24"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.8"
slint = "1.14.1"
slint-build = "1.14.1"
sqlx = { version = "0.8.6", default-features = false }
thiserror = "2.0.17"
tokio = "1.48.0"
toml = "0.8.23"
tower = "0.5.2"
tower-http = "0.6.6"
tower_governor = "0.8.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ts-rs = "11.1.0"
utoipa = "5.4.0"
utoipa-swagger-ui = "9.0.2"
uuid = "1.18.1"
validator = "0.20.0"
